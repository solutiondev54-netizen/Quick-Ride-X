<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-primary shadow">
  <div class="container-fluid d-flex justify-content-between">
    <h3 class="text-light m-0 fw-bold">➕ Add New Admin</h3>
    <a href="{{ url_for('manage_admins') }}" class="btn btn-secondary btn-sm">← Back</a>
  </div>
</nav>

<div class="container mt-5" style="max-width: 500px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" class="card bg-secondary p-4 rounded-4 shadow">
    <div class="mb-3">
      <label for="email" class="form-label text-light">Admin Email</label>
      <input type="email" name="email" id="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label text-light">Password</label>
      <input type="password" name="password" id="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success w-100">✅ Add Admin</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
