{% extends "base.html" %}
{% block title %}QuickRideX Admin Login{% endblock %}

{% block content %}
<style>
body {
  background: linear-gradient(to right, #1a1a1a, #007bff);
  min-height: 100vh;
}
.login-card {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  padding: 40px;
  max-width: 450px;
  margin: 100px auto;
}
.btn-admin {
  background-color: #007bff;
  color: white;
  border-radius: 10px;
  border: none;
  font-weight: bold;
}
.btn-admin:hover {
  background-color: #0056b3;
}
</style>

<div class="login-card text-center">
  <h2 class="fw-bold mb-3 text-primary">SuperAdmin Access</h2>
  <p class="text-muted mb-4">Only authorized administrators can log in.</p>

  <form method="POST">
    <div class="mb-3 text-start">
      <label class="form-label">Email or Username</label>
      <input type="text" name="login_id" class="form-control" placeholder="Enter admin email or username" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
        <button type="button" class="btn btn-outline-secondary" id="togglePassword">Show</button>
      </div>
    </div>

    <button type="submit" class="btn btn-admin w-100 py-2 mt-2">Login as Admin</button>
  </form>

  <div class="text-center mt-4">
  <a href="{{ url_for('login') }}"
     class="btn btn-gradient w-100 py-2 fw-bold shadow-lg"
     style="background: linear-gradient(90deg, #28a745, #00d084); color: white; border-radius: 12px; text-decoration: none;">
     ⬅ Back to User Login
  </a>
</div>

<script>
const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");
togglePassword.addEventListener("click", () => {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    togglePassword.textContent = "Hide";
  } else {
    passwordInput.type = "password";
    togglePassword.textContent = "Show";
  }
});
</script>
{% endblock %}
