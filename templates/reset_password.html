<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRideX – Reset Password</title>

    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .reset-container {
            max-width: 420px;
            margin: 40px auto;
            background: #111;
            padding: 30px 25px;
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0,255,120,0.15);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: #00ff7f;
            font-weight: 600;
            margin-bottom: 3px;
        }

        p.subtitle {
            text-align: center;
            margin-top: 0;
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 4px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: none;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #00ff7f;
        }

        .password-container {
            position: relative;
        }

        .toggle-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            font-size: 17px;
        }

        .error {
            color: #ff4f4f;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 10px;
            display: none;
        }

        .btn {
            width: 100%;
            background: #00ff7f;
            color: #000;
            padding: 13px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #00d96b;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            opacity: 0.7;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h2>Reset Password</h2>
    <p class="subtitle">Create a new strong password</p>

    <form action="{{ url_for('reset_password', token=token) }}" method="POST" id="resetForm">

        <!-- NEW PASSWORD -->
        <label>New Password</label>
        <div class="password-container">
            <input type="password" name="password" id="password" required>
            <i class="fa-solid fa-eye toggle-icon" onclick="togglePassword('password', this)"></i>
        </div>

        <!-- CONFIRM PASSWORD -->
        <label>Confirm Password</label>
        <div class="password-container">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <i class="fa-solid fa-eye toggle-icon" onclick="togglePassword('confirm_password', this)"></i>
        </div>

        <div id="passwordError" class="error">Passwords do not match.</div>

        <button type="submit" class="btn">Update Password</button>
    </form>

    <div class="footer">
        © 2025 QuickRideX Technologies. All Rights Reserved.
    </div>
</div>

<script>
function togglePassword(id, icon) {
    const field = document.getElementById(id);
    const isPassword = field.type === "password";
    field.type = isPassword ? "text" : "password";
    icon.classList.toggle("fa-eye-slash");
}

// Password Match Validation
document.getElementById("confirm_password").addEventListener("input", function () {
    const pass = document.getElementById("password").value;
    const confirm = this.value;
    const error = document.getElementById("passwordError");

    error.style.display = pass === confirm ? "none" : "block";
});
</script>

</body>
</html>
