<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: "Poppins", sans-serif;
            text-align: center;
            padding: 100px 20px;
        }
        h1 {
            font-size: 4rem;
            color: #ef4444;
        }
        p {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .details {
            background-color: #1e293b;
            color: #93c5fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: inline-block;
            text-align: left;
            max-width: 600px;
            word-wrap: break-word;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>500</h1>
    <p>{{ message }}</p>
    <div class="details">{{ details }}</div>
    <p><a href="/overview">← Back to Dashboard</a></p>
</body>
</html>
