<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRideX – Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: #0b0b0b;
            font-family: "Poppins", sans-serif;
            color: #fff;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,255,120,0.15);
        }
        h2 {
            text-align: center;
            color: #00ff7f;
            font-weight: 600;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            opacity: 0.7;
            margin-top: 0;
        }
        label {
            font-weight: 500;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: none;
            background: #1a1a1a;
            color: #fff;
        }
        input:focus, select:focus {
            outline: 2px solid #00ff7f;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
        }
        .btn {
            width: 100%;
            background: #00ff7f;
            color: #000;
            padding: 14px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:hover {
            background: #00d96b;
        }
        .checkbox-group {
            margin-bottom: 20px;
        }
        .checkbox-group label {
            margin-left: 6px;
            font-size: 14px;
        }
        .error {
            color: #ff4f4f;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Create Account</h2>
    <p class="subtitle">Join QuickRideX today</p>

    <form action="{{ url_for('register') }}" method="POST" id="registerForm" enctype="multipart/form-data">

        <!-- ROLE -->
        <label>Role</label>
        <select name="role" id="role" required>
            <option value="">Select role</option>
            <option value="user">User</option>
            <option value="driver">Driver</option>
            <option value="admin">Admin</option>
        </select>

        <!-- FULL NAME -->
        <label>Full Name</label>
        <input type="text" name="fullname" required>

        <!-- USERNAME -->
        <label>Username</label>
        <input type="text" name="username" required>

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" name="email" required>

        <!-- COUNTRY & DIAL CODE -->
        <label>Country</label>
        <select id="country" required></select>

        <label>Dial Code</label>
        <select id="dialcode" required></select>

        <!-- PHONE -->
        <label>Phone Number</label>
        <input type="tel" id="phone" required>

        <!-- HIDDEN E.164 PHONE -->
        <input type="hidden" name="phone_e164" id="phone_e164">

        <!-- PASSWORD -->
        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="password" required>
            <i class="fa-solid fa-eye toggle-icon" onclick="togglePassword('password', this)"></i>
        </div>

        <!-- CONFIRM PASSWORD -->
        <label>Confirm Password</label>
        <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <i class="fa-solid fa-eye toggle-icon" onclick="togglePassword('confirm_password', this)"></i>
        </div>

        <!-- REFERRAL -->
        <label>Referral Code (optional)</label>
        <input type="text" name="referral">

        <!-- GENDER -->
        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <!-- DOB -->
        <label>Date of Birth</label>
        <input type="date" name="dob" required>

        <!-- ADDRESS -->
        <label>Address</label>
        <input type="text" name="address" required>

        <!-- PHOTO UPLOAD -->
        <label>Profile Photo</label>
        <input type="file" name="photo" accept="image/*">

        <!-- CAPTCHA -->
        <label>Verify you're human</label>
        <div>
            <span id="captcha_q" style="font-weight:600;"></span>
        </div>
        <input type="number" id="captcha_answer" placeholder="Enter answer" required>

        <div class="error" id="captcha_error">Incorrect answer.</div>

        <!-- TERMS CHECKBOXES -->
        <div class="checkbox-group">
            <input type="checkbox" name="terms" required> <label>Accept Terms & Conditions</label><br>
            <input type="checkbox" name="privacy" required> <label>Accept Privacy Policy</label><br>
            <input type="checkbox" name="legal" required> <label>Acknowledge Legal Information</label>
        </div>

        <button class="btn" type="submit">Create Account</button>
    </form>

</div>

<script>
/* Password toggle */
function togglePassword(id, icon) {
    const field = document.getElementById(id);
    const isPass = field.type === "password";
    field.type = isPass ? "text" : "password";
    icon.classList.toggle("fa-eye-slash");
}

/* Load country & dial code list */
const countries = [
    { name: "United States", code: "+1" },
    { name: "United Kingdom", code: "+44" },
    { name: "Nigeria", code: "+234" },
    { name: "Canada", code: "+1" },
    { name: "India", code: "+91" },
];

const countrySel = document.getElementById("country");
const dialSel = document.getElementById("dialcode");

countries.forEach(c => {
    countrySel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    dialSel.innerHTML += `<option value="${c.code}">${c.code}</option>`;
});

countrySel.onchange = () => {
    const c = countries.find(x => x.name === countrySel.value);
    dialSel.value = c.code;
};

/* Build E.164 phone */
document.getElementById("phone").addEventListener("input", () => {
    const dial = dialSel.value;
    const phone = document.getElementById("phone").value.replace(/\D/g, '');
    document.getElementById("phone_e164").value = dial + phone;
});

/* Captcha */
let a = Math.floor(Math.random()*10)+1;
let b = Math.floor(Math.random()*10)+1;
document.getElementById("captcha_q").innerText = `${a} + ${b} = ?`;

document.getElementById("registerForm").addEventListener("submit", function(e) {
    const ans = parseInt(document.getElementById("captcha_answer").value);
    if (ans !== a + b) {
        e.preventDefault();
        document.getElementById("captcha_error").style.display = "block";
    }
});
</script>

</body>
</html>
