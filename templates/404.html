{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <h1 class="display-4 text-danger fw-bold">404</h1>
  <p class="lead mb-3">Oops! The page you're looking for doesn’t exist.</p>
  <p class="text-muted">It may have been moved, deleted, or the link is incorrect.</p>
  <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
    🏠 Return to Homepage
  </a>
</div>
{% endblock %}
