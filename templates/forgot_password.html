<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRideX – Forgot Password</title>

    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .forgot-container {
            max-width: 420px;
            margin: 40px auto;
            background: #111;
            padding: 30px 25px;
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0,255,120,0.15);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: #00ff7f;
            font-weight: 600;
            margin-bottom: 3px;
        }

        p.subtitle {
            text-align: center;
            margin-top: 0;
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 4px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: none;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #00ff7f;
        }

        .btn {
            width: 100%;
            background: #00ff7f;
            color: #000;
            padding: 13px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #00d96b;
        }

        .error {
            color: #ff4f4f;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 10px;
            display: none;
        }

        .back-btn {
            width: 100%;
            margin-top: 14px;
            background: transparent;
            color: #00ff7f;
            padding: 12px;
            border: 1px solid #00ff7f;
            font-weight: 500;
            border-radius: 8px;
            text-align: center;
            display: block;
            text-decoration: none;
            transition: 0.25s;
        }

        .back-btn:hover {
            background: #00ff7f;
            color: #000;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            opacity: 0.7;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="forgot-container">

    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <form action="{{ url_for('forgot_password') }}" method="POST" id="forgotForm">

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" name="email" id="email" required>
        <div id="emailError" class="error">Please enter a valid email.</div>

        <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <a href="{{ url_for('login') }}" class="back-btn">Back to Login</a>

    <div class="footer">
        © 2025 QuickRideX Technologies. All Rights Reserved.
    </div>
</div>

<script>
// Email Validation (Optional Real-Time)
document.getElementById("email").addEventListener("input", function () {
    const email = this.value;
    const error = document.getElementById("emailError");

    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    error.style.display = pattern.test(email) ? "none" : "block";
});
</script>

</body>
</html>
